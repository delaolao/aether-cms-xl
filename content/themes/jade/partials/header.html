<!-- ============================================================
     顶部导航（粘性）
     导航项是硬编码白名单（2026-09-15 需求）：首页 / 图谱 / 标签云 / 站内搜索。
     改导航请改这里；后台「设置 → 菜单」的内容不影响前台导航。
     /notes/graph 与 /tag-cloud 由 core 路由提供。
     ============================================================ -->
<header class="site-header" data-sticky-header>
    <div class="container header-inner">
        <div class="brand">
            {{#if site.siteLogo}}
            <a href="/" class="brand-logo">
                <img src="/content/uploads{{site.siteLogo}}" alt="{{ site.siteTitle }}" />
            </a>
            {{/if}}
            <span class="brand-text">
                <a class="brand-title" href="/">{{ site.siteTitle }}</a>
                <span class="brand-tagline">心理健康教育资源</span>
            </span>
        </div>

        <nav class="site-navigation" aria-label="主导航">
            <ul class="nav-menu">
                <li class="menu-item"><a href="/">首页</a></li>
                <li class="menu-item"><a href="/notes/graph">图谱</a></li>
                <li class="menu-item"><a href="/tag-cloud">标签云</a></li>
                <li class="menu-item"><a href="/search">站内搜索</a></li>
            </ul>
        </nav>

        <div class="header-actions">
            <a class="header-search" href="/search" aria-label="搜索资源">
                <span class="header-search-icon" aria-hidden="true">⌕</span>
                <span class="header-search-text">搜索</span>
            </a>
        </div>
    </div>
</header>
